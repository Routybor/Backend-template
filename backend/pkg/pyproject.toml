[project]
name = "backend-common"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.75.0",
    "protobuf>=5.30.0",
    "prometheus-client>=0.22.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "starlette>=0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

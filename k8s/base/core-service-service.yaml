apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app: core-service
spec:
  type: ClusterIP
  ports:
    - port: ${CORE_SERVICE_PORT}
      targetPort: ${CORE_SERVICE_PORT}
      protocol: TCP
      name: http
    - port: ${CORE_SERVICE_GRPC_PORT}
      targetPort: ${CORE_SERVICE_GRPC_PORT}
      protocol: TCP
      name: grpc
  selector:
    app: core-service
